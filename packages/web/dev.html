<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>마이티 - 3인 시험</title>
    <style>
      body { margin: 0; display: flex; height: 100vh; background: #222; }
      iframe { flex: 1; border: 0; border-right: 2px solid #000; min-width: 0; }
    </style>
  </head>
  <body>
    <!-- 개발용: 한 브라우저에서 플레이어 3명(프로필 p=1,2,3)을 나란히 띄운다 -->
    <iframe id="p1" src="/?p=1"></iframe>
    <iframe id="p2" src="/?p=2"></iframe>
    <iframe id="p3" src="/?p=3"></iframe>
  </body>
</html>
